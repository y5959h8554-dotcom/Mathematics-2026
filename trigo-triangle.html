<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trigonométrie — Triangle rectangle</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6;
    --ink:#1c2321;
    --line:#2b3a36;
    --accent:#c2410c;
    --accent2:#0e7c6b;
    --red:#c0392b;
    --purple:#7d3cb5;
    --faint:#c9c0b1;
    --grid:#e4ddcf;
    --glow:234,179,8;      /* jaune : ce qu'il faut faire maintenant */
    --xp:#2f9e44;          /* vert : barre de progression */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Fraunces",Georgia,serif;
    display:flex;flex-direction:column;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  header{
    padding:18px 24px 12px;
    border-bottom:1px solid var(--faint);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  header h1{
    font-size:1.5rem;font-weight:600;margin:0;letter-spacing:-0.01em;
  }
  header .sub{
    font-family:"Spline Sans Mono",monospace;
    font-size:0.72rem;color:var(--accent2);text-transform:uppercase;letter-spacing:0.14em;
  }
  /* layout via grid; areas reflow between stage 1 and stage 2 */
  .main{
    flex:1;min-height:0;display:grid;gap:0;margin-top:18px;
    grid-template-columns:340px 1fr;
    grid-template-rows:1fr auto;
    grid-template-areas:
      "ratios  stage"
      "actions stage";
  }
  .stage{grid-area:stage;position:relative;min-width:0;min-height:0;
    background:#fffefc;margin:0 18px 18px 18px;border-radius:3px;
    box-shadow:0 1px 2px rgba(60,50,30,0.10),0 6px 22px rgba(60,50,30,0.10);}
  .ratios{grid-area:ratios;}
  .props{grid-area:props;}
  .panel-actions{grid-area:actions;}

  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .prompt{
    display:none;
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;transition:opacity .4s;
    max-width:80%;
  }
  .prompt .big{font-size:1.6rem;font-style:italic;color:var(--line);line-height:1.3;}
  button{
    font-family:"Spline Sans Mono",monospace;font-size:0.78rem;
    text-transform:uppercase;letter-spacing:0.08em;
    background:transparent;border:1.5px solid var(--line);color:var(--line);
    padding:10px 18px;border-radius:2px;cursor:pointer;transition:.15s;
  }
  button:active{background:var(--line);color:var(--paper);}
  button.primary{border-color:var(--accent);color:var(--accent);}
  button.primary:active{background:var(--accent);color:var(--paper);}

  .ratios{
    padding:22px 24px;border-right:1px solid var(--faint);
    display:flex;flex-direction:column;gap:22px;align-items:flex-start;
    overflow-y:auto;
  }
  .panel-actions{
    padding:14px 24px;border-right:1px solid var(--faint);
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  #continue{ border-color:var(--accent2);color:var(--accent2); }
  #continue:active{background:var(--accent2);color:var(--paper);}

  /* ---- stage 2 reflow: triangle top-left, ratios bottom-left, props right ---- */
  body.stage2 .main{
    grid-template-columns:1.15fr 1fr;
    grid-template-rows:1fr 1fr auto;
    grid-template-areas:
      "stage  props"
      "ratios props"
      "actions props";
  }
  body.stage2 .stage{margin:0 0 0 18px;}
  body.stage2 .ratios{
    border-right:none;border-top:none;
    flex-direction:column;flex-wrap:nowrap;gap:18px;
    align-items:center;justify-content:center;
    padding:36px 22px 16px;font-size:1em;
  }
  body.stage2 .ratio{padding:6px 12px;gap:12px;}
  body.stage2 .ratio .fn{font-size:1.2rem;}
  body.stage2 .ratio .eq{font-size:1.2rem;}
  body.stage2 .frac{min-width:58px;}
  body.stage2 .box{min-width:58px;min-height:34px;}
  body.stage2 .box.filled{font-size:1.2rem;}
  body.stage2 .panel-actions{border-right:none;}

  .props{display:none;}
  body.stage2 .props{
    display:flex;flex-direction:column;gap:16px;
    margin:18px 22px;padding:18px 20px;
    border:2px solid var(--accent);border-radius:12px;
    background:rgba(194,65,12,0.06);overflow-y:auto;
  }
  .props h2{
    margin:0 0 4px;font-family:"Spline Sans Mono",monospace;
    font-size:0.74rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);
  }
  .props .quant{
    font-family:"Fraunces",Georgia,serif;font-style:italic;
    font-size:1.05rem;color:var(--ink);margin-bottom:2px;
  }
  .prop{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-family:"Fraunces",Georgia,serif;font-size:1.05rem;
    padding:6px 8px;border-radius:8px;transition:background .2s;
  }
  .prop.correct{background:rgba(14,124,107,0.16);}
  .prop.wrong{background:rgba(192,57,43,0.16);}
  .prop.presque{background:rgba(230,126,34,0.22);}
  .prop::after{order:1;} .prop .note{order:2;flex-basis:100%;font-family:"Spline Sans Mono",monospace;font-size:0.76rem;color:#a85a00;margin-top:2px;}
  .prop .ecart{display:inline-block;width:26px;}
  .pbox{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:52px;height:34px;padding:0 8px;
    border:2px dotted var(--faint);border-radius:6px;
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
    color:var(--ink);transition:.15s;vertical-align:middle;
  }
  .pbox.over{border-color:var(--accent2);background:rgba(14,124,107,0.1);border-style:solid;}
  .pbox.filled{border-style:solid;border-color:var(--ink);}
  .pfrac{
    display:inline-flex;flex-direction:column;align-items:stretch;
    gap:3px;vertical-align:middle;
  }
  .pfrac .pbar{height:2px;background:var(--ink);width:100%;}
  .sup{font-size:0.75em;align-self:flex-start;margin:0 0 0 -6px;line-height:1;}
  /* fn labels become draggable in stage 2 */
  body.stage2 .ratio .fn{
    cursor:grab;border:1.5px solid var(--faint);border-radius:6px;
    padding:3px 8px;background:var(--paper);user-select:none;touch-action:none;
  }
  body.stage2 .ratio .fn:active{cursor:grabbing;border-color:var(--accent2);}
  .ratio{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:8px;transition:background .2s;
  }
  .ratio.wrong{background:rgba(192,57,43,0.14);}
  .ratio.correct{background:rgba(14,124,107,0.16);}
  .ratio .fn{
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.15rem;
    white-space:nowrap;
  }
  .ratio .eq{font-size:1.15rem;}
  .frac{
    display:inline-flex;flex-direction:column;align-items:stretch;gap:4px;
    min-width:58px;
  }
  .frac .bar{height:2px;background:var(--ink);width:100%;}
  .box{
    min-height:38px;min-width:58px;padding:3px 8px;
    border:2px dashed var(--faint);border-radius:6px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Spline Sans Mono",monospace;font-size:0.74rem;line-height:1.15;
    color:var(--line);transition:.15s;
  }
  .box.empty::before{content:"";}
  .box.over{border-color:var(--accent2);background:rgba(14,124,107,0.08);border-style:solid;}
  .box.filled{border-color:transparent;background:transparent;
    font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.3rem;letter-spacing:0.02em;}
  .box[data-role="hyp"].filled{color:var(--ink);}
  .box[data-role="opp"].filled{color:var(--red);}
  .box[data-role="adj"].filled{color:var(--purple);}
  .consigne{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.15rem;line-height:1.35;color:var(--line);
    border-left:3px solid rgb(var(--glow));padding:8px 12px 8px 12px;border-radius:0 8px 8px 0;
    background:rgba(var(--glow),0.08);}
  /* lueur jaune presque fixe (respiration très lente) sur ce qui est à faire */
  .consigne,.lueur{box-shadow:0 0 12px 3px rgba(var(--glow),0.40);animation:lueur 5s ease-in-out infinite;}
  @keyframes lueur{0%,100%{box-shadow:0 0 12px 3px rgba(var(--glow),0.36);}50%{box-shadow:0 0 15px 4px rgba(var(--glow),0.50);}}
  @media (prefers-reduced-motion:reduce){.consigne,.lueur{animation:none;}}
  /* impulsion quand une tâche est réussie : la suivante s'illumine 1,5 s */
  @keyframes impulsion{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(var(--glow),0);}
    22%{transform:scale(1.045);box-shadow:0 0 30px 12px rgba(var(--glow),0.80);background-color:rgba(var(--glow),0.30);}
    100%{transform:scale(1);box-shadow:0 0 12px 3px rgba(var(--glow),0.40);}}
  @keyframes impulsionCase{0%{} 25%{border-color:rgb(var(--glow));background:rgba(var(--glow),0.28);} 100%{}}
  @keyframes segFlash{0%{background:#fde047;transform:scaleY(1.6);} 100%{transform:scaleY(1);}}
  @keyframes compteur{0%{transform:translate(-50%,-50%) scale(1);} 30%{transform:translate(-50%,-50%) scale(1.25);} 100%{transform:translate(-50%,-50%) scale(1);}}
  .impulsion{animation:impulsion 1.5s ease-out 1 !important;}
  .impulsion .box:not(.filled){animation:impulsionCase 1.5s ease-out 1;}
  .xp .seg.flash{animation:segFlash 1.2s ease-out 1;}
  .xp-n.flash{animation:compteur 0.9s ease-out 1;}
  @media (prefers-reduced-motion:reduce){.impulsion{animation:none !important;}}
  .consigne.termine{animation:none;box-shadow:none;border-left-color:var(--xp);background:rgba(47,158,68,0.10);}
  .ang-a{color:var(--purple);} .ang-b{color:var(--red);}
  /* jetons A, B, C à placer sur les sommets */
  .jetons{display:flex;gap:18px;padding:4px 2px;}
  .jeton{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:22px;color:var(--ink);
    cursor:grab;touch-action:none;}
  .jeton:active{cursor:grabbing;}
  #dragChip.rond{width:48px;height:48px;border-radius:50%;padding:0;align-items:center;justify-content:center;
    font-size:22px;border-color:var(--ink);color:var(--ink);}
  /* barre de progression */
  .xp{position:relative;display:flex;gap:3px;height:22px;flex:0 1 460px;min-width:220px;margin-left:auto;align-self:center;}
  .xp .seg{flex:1;border-radius:3px;background:rgba(47,158,68,0.13);transition:background .5s;}
  .xp .seg.on{background:var(--xp);}
  .xp-n{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-family:"Spline Sans Mono",monospace;font-size:0.72rem;font-weight:500;color:var(--xp);
    background:var(--paper);border:1.5px solid var(--xp);border-radius:11px;padding:1px 9px;white-space:nowrap;}
  /* indice */
  .indice-wrap{position:relative;}
  #indice{border:1.5px dashed rgb(var(--glow));color:#8a6a00;}
  #indice:active{background:rgba(var(--glow),0.2);color:#8a6a00;}
  .indice-pop{position:absolute;bottom:calc(100% + 10px);left:0;z-index:40;display:none;
    background:var(--paper);border:2px solid rgb(var(--glow));border-radius:10px;padding:12px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.5rem;
    letter-spacing:0.06em;white-space:nowrap;color:var(--ink);}
  .indice-pop.vu{display:block;}
  /* case à remplir au clavier (propriétés) */
  .pinput{width:58px;height:34px;border:2px dotted var(--faint);border-radius:6px;background:transparent;
    font-family:"Fraunces",Georgia,serif;font-size:1.05rem;text-align:center;color:var(--ink);
    user-select:text;-webkit-user-select:text;touch-action:auto;}
  .pinput:focus{outline:none;border-style:solid;border-color:var(--accent2);}
  .pinput.filled{border-style:solid;border-color:var(--ink);}
  .box.over.filled{border-color:var(--accent2);border-style:solid;}
  .ratio::after,.prop::after{content:"";display:inline-block;width:1.1em;flex:none;
    font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.25rem;color:var(--accent2);text-align:center;}
  .prop::after{margin-left:auto;}
  .ratio.correct::after,.prop.correct::after{content:"✓";}
  .consigne .faux{display:block;font-style:normal;font-family:"Spline Sans Mono",monospace;font-size:0.78rem;color:var(--red);margin-top:6px;}
  .colonne{display:flex;flex-direction:column;gap:14px;}
  body.stage2 .ratios{display:grid;grid-template-columns:auto auto;gap:10px 36px;align-content:center;justify-content:center;}
  body.stage2 .ratio.correct{background:none;}
  body.stage2 .ratio::after{display:none;}
  body.stage2 .colonne{gap:10px;}
  .pfixe{font-style:italic;text-align:center;}
  /* floating drag chip */
  #dragChip{
    position:fixed;pointer-events:none;z-index:50;display:none;
    padding:6px 10px;border-radius:6px;background:var(--paper);
    border:2px solid currentColor;
    font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.3rem;letter-spacing:0.02em;
    transform:translate(-50%,-50%);box-shadow:0 6px 20px rgba(0,0,0,0.18);
    white-space:nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>Trigonométrie dans un triangle rectangle</h1>
  <div class="xp" id="xp" title="Progression"><span class="xp-n" id="xpN"></span></div>
</header>

<div class="main" id="main">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="prompt" id="prompt">
      <div class="big">Trace un triangle rectangle</div>
    </div>
  </div>

  <div class="ratios" id="ratios"></div>
  <div class="props" id="props"></div>
  <div class="panel-actions">
    <button id="continue" style="display:none;">Continuer →</button>
    <button id="undo">Effacer</button>
    <span class="indice-wrap" id="indiceWrap" style="display:none;">
      <button id="indice" type="button">? Indice</button>
      <span class="indice-pop" id="indicePop">SOH-CAH-TOA</span>
    </span>
  </div>
</div>

<div id="dragChip"></div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const promptEl = document.getElementById('prompt');
const undoBtn = document.getElementById('undo');
const ratiosEl = document.getElementById('ratios');
const dragChip = document.getElementById('dragChip');

let DPR = Math.max(1, window.devicePixelRatio||1);
let W=0,H=0;

function resize(){
  const r = cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
window.addEventListener('resize',resize);

// ---- state ----
// mode : 'idle' | 'draw' | 'ready' (animation) | 'snapped' (triangle rectangle ABC, angle droit en C)
let mode='idle';
let path=[];
let triangle=null;    // {pts:[{x,y}x3], rightIndex}
let snapTarget=null;

// Étapes, une fois le triangle tracé :
//   noms (placer A, B, C) → hyp → adjA → oppA → ratA (sin, cos, tan de α) → adjB → oppB → ratB (… de β) → fini
const PHASES=['noms','hyp','adjA','oppA','ratA','adjB','oppB','ratB','fini'];
let phase='noms';
let placement=[null,null,null];        // lettre posée sur chaque sommet (étape noms)
let indiceVu=false;
// « l'angle α » en mauve, « l'angle β » en rouge
const ANG={A:`<span class="ang-a">l'angle α</span>`, B:`<span class="ang-b">l'angle β</span>`};
// côté attendu à chaque clic, et étiquette affichée quand il est trouvé
const ATTENDU={ hyp:{edge:'AB', text:'hypoténuse', nom:"l'hypoténuse"},
  adjA:{edge:'AC', text:'adjacent à α', nom:`le côté adjacent à ${ANG.A}`},
  oppA:{edge:'BC', text:'opposé à α',   nom:`le côté opposé à ${ANG.A}`},
  adjB:{edge:'BC', text:'adjacent à β', nom:`le côté adjacent à ${ANG.B}`},
  oppB:{edge:'AC', text:'opposé à β',   nom:`le côté opposé à ${ANG.B}`} };
let rev={AB:null, AC:null, BC:null};   // étiquettes affichées sur les côtés
let flash=null;                        // {edge, until} : clic sur un mauvais côté
let messageFaux='';

// suivi : erreurs comptées une fois par combinaison
let ec=0;                              // clics sur un mauvais côté
let errSeen=new Set(), err1=0, err2Seen=new Set(), err2=0;

// max deviation from 90° still accepted as "the student meant a right angle"
const RIGHT_TOLERANCE = 10;   // écart maximal à 90° (degrés)

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// angle at vertex b formed by a-b-c, in degrees
function angleAt(a,b,c){
  const v1={x:a.x-b.x,y:a.y-b.y};
  const v2={x:c.x-b.x,y:c.y-b.y};
  const dot=v1.x*v2.x+v1.y*v2.y;
  const m1=Math.hypot(v1.x,v1.y), m2=Math.hypot(v2.x,v2.y);
  if(m1===0||m2===0) return 0;
  let cos=dot/(m1*m2);
  cos=Math.max(-1,Math.min(1,cos));
  return Math.acos(cos)*180/Math.PI;
}

function triangleAngles(p){
  return [
    angleAt(p[2],p[0],p[1]),
    angleAt(p[0],p[1],p[2]),
    angleAt(p[1],p[2],p[0]),
  ];
}

// Reduce a freehand path to 3 corner points using max-deviation (Douglas-Peucker-ish to 3)
function reduceTo3(pts){
  if(pts.length<3) return null;
  // ensure closed-ish: work on the open polyline, find the 2 sharpest corners + endpoints
  // Strategy: the path roughly closes; take farthest pair as a baseline.
  // deux sommets = paire de points la plus éloignée (indépendant du point de départ)
  let B=pts[0], maxd=0;
  for(const p of pts){const d=dist(pts[0],p); if(d>maxd){maxd=d;B=p;}}
  let A=B; maxd=0;
  for(const p of pts){const d=dist(B,p); if(d>maxd){maxd=d;A=p;}}
  // find point with max distance from line A-B
  function perp(p,a,b){
    const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
    return Math.abs((p.x-a.x)*dy-(p.y-a.y)*dx)/L;
  }
  let C=A, mc=0;
  for(const p of pts){const d=perp(p,A,B); if(d>mc){mc=d;C=p;}}
  if(mc<12) return null; // too flat, not a triangle
  return [ {x:A.x,y:A.y},{x:B.x,y:B.y},{x:C.x,y:C.y} ];
}

function buildTriangle(pts){
  if(!pts||pts.length<3) return null;
  const angles=triangleAngles(pts);
  // right vertex = closest to 90
  let ri=0, best=Infinity;
  angles.forEach((a,i)=>{const d=Math.abs(a-90); if(d<best){best=d;ri=i;}});
  return {pts:pts.map(p=>({...p})), rightIndex:ri, angles, dev:best};
}

// Closest right triangle to the drawn one (least-squares sense).
// For a chosen right vertex R with legs to A and B: close the gap between the
// legs to exactly 90° by rotating each leg, splitting the correction so the
// LONGER leg rotates LESS (weights ∝ the other leg's squared length). This is
// the displacement-minimising correction when leg lengths are kept. Closed
// form, stable, instant. Tried for all three vertices; lowest residual wins.
function fitRightTriangle(P, ri){
  const R=P[ri], A=P[(ri+1)%3], B=P[(ri+2)%3];
  const u={x:A.x-R.x,y:A.y-R.y}, v={x:B.x-R.x,y:B.y-R.y};
  const L1=Math.hypot(u.x,u.y), L2=Math.hypot(v.x,v.y);
  const a1=Math.atan2(u.y,u.x), a2=Math.atan2(v.y,v.x);
  let diff=a2-a1;
  while(diff> Math.PI) diff-=2*Math.PI;
  while(diff<-Math.PI) diff+=2*Math.PI;
  const sign=diff>=0?1:-1;
  const phi=Math.abs(diff);
  const D=phi-Math.PI/2;                       // signed gap to close
  const denom=(L1*L1+L2*L2)||1;
  const wa=D*L2*L2/denom;                       // rotate shorter-weighted
  const wb=D*L1*L1/denom;
  const na1=a1+sign*wa, na2=a2-sign*wb;
  const Ap={x:R.x+Math.cos(na1)*L1, y:R.y+Math.sin(na1)*L1};
  const Bp={x:R.x+Math.cos(na2)*L2, y:R.y+Math.sin(na2)*L2};
  const out=[null,null,null];
  out[ri]={...R}; out[(ri+1)%3]=Ap; out[(ri+2)%3]=Bp;
  const resid=dist(A,Ap)**2+dist(B,Bp)**2;
  return {pts:out, residual:resid, rightIndex:ri};
}

function closestRightTriangle(P){
  let best=null;
  for(let ri=0; ri<3; ri++){
    const f=fitRightTriangle(P,ri);
    if(!best || f.residual<best.residual) best=f;
  }
  return best;
}

// Labels: right vertex = C. Going in positive (math counterclockwise)
// orientation from C, the next vertex is B, then A.
// Screen y points down, so math-CCW is screen-clockwise; we flip y to judge.
function vertexLabels(p, ri){
  const C=p[ri], i1=(ri+1)%3, i2=(ri+2)%3;
  // signed area in math coords (y flipped) for the ordered triple C, p[i1], p[i2]
  const ax=p[i1].x-C.x, ay=-(p[i1].y-C.y);
  const bx=p[i2].x-C.x, by=-(p[i2].y-C.y);
  const crossZ = ax*by - ay*bx;   // >0 => C->i1->i2 is CCW (positive)
  const labels=[null,null,null];
  labels[ri]='C';
  if(crossZ>0){ labels[i1]='B'; labels[i2]='A'; }   // i1 is the CCW-next from C
  else        { labels[i2]='B'; labels[i1]='A'; }
  return labels;
}


function norm(v){const m=Math.hypot(v.x,v.y)||1;return{x:v.x/m,y:v.y/m};}
function getCSS(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const stage2=()=>document.body.classList.contains('stage2');
const phaseIdx=()=>stage2()?9:PHASES.indexOf(phase);

// sommets nommés du triangle courant
function sommets(tri){
  const p=tri.pts, labels=tri.labels || vertexLabels(p,tri.rightIndex);
  const idx={}; labels.forEach((l,i)=>idx[l]=i);
  return {A:p[idx.A], B:p[idx.B], C:p[idx.C], labels};
}
function aretes(tri){
  const {A,B,C}=sommets(tri);
  return {AB:{a:A,b:B}, AC:{a:A,b:C}, BC:{a:B,b:C}};
}
// couleurs fixes : α et le côté [AC] en mauve, β et le côté [BC] en rouge
function couleurArete(e){ return e==='AC'?getCSS('--purple'):e==='BC'?getCSS('--red'):getCSS('--ink'); }
function areteConnue(e){
  if(stage2()) return true;
  const i=phaseIdx();
  if(e==='AB') return i>=2;
  if(e==='AC') return i>=3;
  if(e==='BC') return i>=4;
}

// ---- dessin ----
function draw(){
  ctx.clearRect(0,0,W,H);
  if(mode==='draw' && path.length>1){
    ctx.strokeStyle=getCSS('--accent'); ctx.lineWidth=3;
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
    for(const p of path) ctx.lineTo(p.x,p.y);
    ctx.stroke();
  }
  const tri = snapTarget || triangle;
  if(tri) drawTriangle(tri);
}

function drawTriangle(tri){
  const p=tri.pts;
  const {A,B,C,labels}=sommets(tri);
  const INK=getCSS('--ink'), RED=getCSS('--red'), PUR=getCSS('--purple');
  const E=aretes(tri);
  const fini = mode==='snapped';

  ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.lineTo(p[2].x,p[2].y);ctx.closePath();
  ctx.fillStyle='rgba(14,124,107,0.05)';ctx.fill();

  const glisser = fini && !stage2() && (phase==='ratA' || phase==='ratB');
  for(const k of ['AB','AC','BC']){
    const connu = fini && areteConnue(k);
    let col = connu ? couleurArete(k) : INK;
    let w = connu && k!=='AB' ? 5 : 3;
    if(flash && flash.edge===k && performance.now()<flash.until){ col=getCSS('--accent'); w=6; }
    ctx.save();
    if(glisser){ ctx.shadowColor='rgba(234,179,8,0.85)'; ctx.shadowBlur=14+30*boostCanevas(); }   // les côtés à glisser brillent
    ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(E[k].a.x,E[k].a.y);ctx.lineTo(E[k].b.x,E[k].b.y);ctx.stroke();
    ctx.restore();
  }

  // angle droit en C
  {
    const u=norm({x:A.x-C.x,y:A.y-C.y}), v=norm({x:B.x-C.x,y:B.y-C.y});
    const s=Math.min(20, dist(C,A)*0.28, dist(C,B)*0.28);
    const c1={x:C.x+u.x*s,y:C.y+u.y*s}, c2={x:C.x+v.x*s,y:C.y+v.y*s}, c3={x:c1.x+v.x*s,y:c1.y+v.y*s};
    ctx.fillStyle='rgba(28,35,33,0.12)'; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(c1.x,c1.y);ctx.lineTo(c3.x,c3.y);ctx.lineTo(c2.x,c2.y);ctx.closePath();ctx.fill();ctx.stroke();
  }
  // α (mauve) en A, β (rouge) en B
  const nommage = fini && !stage2() && phase==='noms';
  if(fini && !nommage){ angleArc(A,C,B,'α',PUR); angleArc(B,C,A,'β',RED); }

  for(let i=0;i<3;i++){ ctx.fillStyle=INK; ctx.beginPath();ctx.arc(p[i].x,p[i].y,5,0,7);ctx.fill(); }
  if(nommage) for(let i=0;i<3;i++) if(!placement[i]){          // sommets encore sans nom : cible de dépôt
    const bst=boostCanevas();
    ctx.save(); ctx.shadowColor='rgba(234,179,8,0.85)'; ctx.shadowBlur=12+24*bst;
    ctx.strokeStyle='rgba(234,179,8,0.9)'; ctx.lineWidth=2.5+2*bst; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.arc(p[i].x,p[i].y,15+6*bst,0,7); ctx.stroke(); ctx.restore();
  }
  const cx=(p[0].x+p[1].x+p[2].x)/3, cy=(p[0].y+p[1].y+p[2].y)/3;
  ctx.font='600 22px Fraunces, Georgia, serif'; ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<3;i++){
    const d=norm({x:p[i].x-cx,y:p[i].y-cy});
    const lettre = nommage ? placement[i] : labels[i];
    if(lettre){ ctx.fillStyle=INK; ctx.fillText(lettre, p[i].x+d.x*26, p[i].y+d.y*26); }
  }
  if(fini) for(const k of ['AB','AC','BC']) if(rev[k]) edgeLabel(E[k], rev[k], couleurArete(k));

  function angleArc(V,P1,P2,letter,col){
    const a1=Math.atan2(P1.y-V.y,P1.x-V.x), a2=Math.atan2(P2.y-V.y,P2.x-V.x);
    let d=a2-a1; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    const r=Math.min(34, dist(V,P1)*0.4, dist(V,P2)*0.4);
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(V.x,V.y,r,a1,a1+d,d<0);ctx.stroke();
    const mid=a1+d/2;
    ctx.fillStyle=col; ctx.font='italic 600 19px Fraunces, Georgia, serif';
    ctx.fillText(letter, V.x+Math.cos(mid)*(r+16), V.y+Math.sin(mid)*(r+16));
  }
  function edgeLabel(e,text,col){
    const g=labelGeom(e,text);
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.ang);
    ctx.fillStyle=col; ctx.font=g.font;
    ctx.textAlign='center';ctx.textBaseline='middle';
    g.lines.forEach((ln,i)=>ctx.fillText(ln,0,-(g.lines.length-1)*g.lh/2+i*g.lh));
    ctx.restore();
  }
}
// étiquette d'un côté, à l'extérieur du triangle, le long du côté ;
// « … à l'angle α » passe à la ligne ; « \n » sépare deux lignes
const LABEL_FONT='600 14px "Spline Sans Mono", monospace';
function labelGeom(e,text){
  const p=triangle.pts, cx=(p[0].x+p[1].x+p[2].x)/3, cy=(p[0].y+p[1].y+p[2].y)/3;
  const mx=(e.a.x+e.b.x)/2, my=(e.a.y+e.b.y)/2;
  const seg=/^[ABC]{2}$/.test(text);           // notation de longueur AB, AC, BC : police des sommets, droite
  let ang = seg ? 0 : Math.atan2(e.b.y-e.a.y, e.b.x-e.a.x);
  if(ang>Math.PI/2||ang<-Math.PI/2) ang+=Math.PI;
  const out=norm({x:mx-cx,y:my-cy});
  const lines = text.split('\n');
  const font = seg ? '600 21px Fraunces, Georgia, serif' : LABEL_FONT;
  const lh = seg ? 22 : 16, off = seg ? 24 : 22+lines.length*8;
  ctx.save(); ctx.font=font; const w=Math.max(...lines.map(l=>ctx.measureText(l).width)); ctx.restore();
  return {x:mx+out.x*off, y:my+out.y*off, ang, lines, lh, w, h:lines.length*lh, font};
}
// le point pt est-il sur l'étiquette du côté k ? (marge de 8 px)
function surEtiquette(pt,k){
  if(!rev[k]) return false;
  const g=labelGeom(aretes(triangle)[k], rev[k]);
  const dx=pt.x-g.x, dy=pt.y-g.y, c=Math.cos(-g.ang), s=Math.sin(-g.ang);
  const lx=dx*c-dy*s, ly=dx*s+dy*c;
  return Math.abs(lx)<=g.w/2+8 && Math.abs(ly)<=g.h/2+8;
}

// ---- interaction ----
function pos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
let drawing=false, moved=0, dragging=false, dragSide=null;

// côté touché : bande autour du segment, sans les bouts (les angles)
function distToSegInset(px,py,a,b,endInset){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  let t=((px-a.x)*dx+(py-a.y)*dy)/(L*L); t=Math.max(0,Math.min(1,t));
  const along=t*L;
  if(along<endInset || along>L-endInset) return Infinity;
  return Math.hypot(px-(a.x+t*dx), py-(a.y+t*dy));
}
function areteTouchee(pt){
  const E=aretes(triangle);
  let best=null, bd=26;
  for(const k of ['AB','AC','BC']){
    const d=distToSegInset(pt.x,pt.y,E[k].a,E[k].b,18);
    if(d<bd){ bd=d; best=k; }
  }
  if(!best) best=['AB','AC','BC'].find(k=>surEtiquette(pt,k)) || null;   // l'étiquette compte aussi
  return best;
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(mode==='snapped'){
    if(stage2()) return;
    const tap=pos(e);
    if(ATTENDU[phase]){ const k=areteTouchee(tap); if(k) cliquerArete(k); return; }
    if(phase==='ratA'||phase==='ratB'){
      const s=sideAt(tap);
      if(s){
        dragging=true; dragSide={role:s.role,color:s.color,label:s.label};
        try{ cv.setPointerCapture(e.pointerId); }catch(_){}
        showChip(e.clientX,e.clientY);
      }
    }
    return;
  }
  if(mode==='ready') return;
  const p=pos(e);
  moved=0; drawing=true; mode='draw'; path=[p];
  promptEl.style.opacity=0;
});
cv.addEventListener('pointermove',e=>{
  if(dragging){ e.preventDefault(); showChip(e.clientX,e.clientY);
    const b=boxAt(e.clientX,e.clientY);
    document.querySelectorAll('.box.over').forEach(x=>x.classList.remove('over'));
    if(b) b.classList.add('over');
    return;
  }
  if(!drawing)return; e.preventDefault();
  const p=pos(e);
  if(path.length) moved+=dist(p,path[path.length-1]);
  path.push(p); draw();
});
cv.addEventListener('pointerup',e=>{
  if(dragging){
    dragging=false; hideChip();
    try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
    document.querySelectorAll('.box.over').forEach(x=>x.classList.remove('over'));
    const b=boxAt(e.clientX,e.clientY);
    if(b && dragSide){ boxes[b.dataset.ang][b.dataset.fn][b.dataset.pos]=dragSide.role; refreshBoxes(); }
    dragSide=null;
    return;
  }
  if(!drawing)return; drawing=false; e.preventDefault();
  if(moved<14){ path=[]; mode='idle'; promptEl.style.opacity=1; draw(); return; }
  const trait=path.slice();
  const pts=reduceTo3(path);
  path=[];
  if(!pts){ refuserTrace("Ce n'est pas un triangle. Recommence."); return; }
  const msg=controleTrace(trait, pts);
  if(msg){ refuserTrace(msg); return; }
  finalize(buildTriangle(pts));
});

// le trait doit ressembler à un vrai triangle : fermé, côtés droits, assez grand
function distSeg(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy||1;
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function controleTrace(trait, pts){
  const per=dist(pts[0],pts[1])+dist(pts[1],pts[2])+dist(pts[2],pts[0]);
  const minCote=Math.min(dist(pts[0],pts[1]),dist(pts[1],pts[2]),dist(pts[2],pts[0]));
  if(minCote<70) return "Trace un triangle plus grand. Recommence.";
  if(dist(trait[0],trait[trait.length-1]) > Math.max(35, 0.08*per)) return "Ferme le triangle : reviens au point de départ. Recommence.";
  const ecarts=trait.map(q=>Math.min(distSeg(q,pts[0],pts[1]),distSeg(q,pts[1],pts[2]),distSeg(q,pts[2],pts[0]))).sort((a,b)=>a-b);
  const e90=ecarts[Math.floor(ecarts.length*0.9)];
  if(e90 > Math.max(10, 0.015*per)) return "Les côtés doivent être droits. Recommence.";
  return null;
}
function refuserTrace(msg){
  triangle=null; snapTarget=null; mode='idle';
  messageFaux=msg; buildPanel(); promptEl.style.opacity=1; draw();
}
function finalize(tri){
  if(!tri){mode='idle';return;}
  if(tri.dev > RIGHT_TOLERANCE){
    refuserTrace("Ce triangle n'a pas d'angle droit. Recommence."); return;
  }
  const fit=closestRightTriangle(tri.pts);
  triangle={pts:tri.pts.map(p=>({...p})), rightIndex:fit.rightIndex, angles:tri.angles, dev:tri.dev};
  mode='ready';
  animateTo(fit.pts, fit.rightIndex);
}
function animateTo(target, ri){
  const from=triangle.pts.map(p=>({...p}));
  const t0=performance.now(), dur=520;
  function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    snapTarget={pts:from.map((p,i)=>({x:p.x+(target[i].x-p.x)*e, y:p.y+(target[i].y-p.y)*e})), rightIndex:ri};
    draw();
    if(k<1) requestAnimationFrame(step);
    else{
      triangle={pts:target,rightIndex:ri,angles:triangleAngles(target),dev:0};
      snapTarget=null; mode='snapped';
      phase='noms'; placement=[null,null,null]; rev={AB:null,AC:null,BC:null}; messageFaux='';
      buildPanel(); draw(); publierSuivi();
    }
  }
  requestAnimationFrame(step);
}

// ---- étapes de clic : hypoténuse, adjacent, opposé ----
function cliquerArete(k){
  const att=ATTENDU[phase];
  if(k===att.edge){
    rev[k]=att.text; messageFaux='';
    const suivant=PHASES[PHASES.indexOf(phase)+1];
    phase=suivant;
  } else {
    ec++;
    flash={edge:k, until:performance.now()+700};
    messageFaux=`Ce n'est pas ${att.nom}. Réessaie.`;
    setTimeout(draw, 720);
  }
  buildPanel(); draw(); publierSuivi();
}

// ---- fractions : glisser les côtés ----
// rôle de chaque côté pour l'angle en cours (α pendant ratA, β pendant ratB)
function currentSides(){
  if(!triangle) return null;
  const {A,B,C}=sommets(triangle);
  const ang = phase==='ratB' ? 'B' : 'A', sym = ang==='A'?'α':'β';
  const hyp={role:'hyp', a:A, b:B, color:getCSS('--ink'), label:'AB'};
  const AC={a:A,b:C,color:getCSS('--purple'),label:'AC'}, BC={a:B,b:C,color:getCSS('--red'),label:'BC'};
  const opp = ang==='A' ? {...BC, role:'opp'} : {...AC, role:'opp'};
  const adj = ang==='A' ? {...AC, role:'adj'} : {...BC, role:'adj'};
  return {sym, sides:[hyp,opp,adj]};
}
function sideAt(pt){
  const info=currentSides(); if(!info) return null;
  const k=areteTouchee(pt); if(!k) return null;
  const E=aretes(triangle)[k];
  return info.sides.find(s=>(s.a===E.a&&s.b===E.b)||(s.a===E.b&&s.b===E.a)) || null;
}

const CORRECT = { sin:{num:'opp',den:'hyp'}, cos:{num:'adj',den:'hyp'}, tan:{num:'opp',den:'adj'} };
const freshAng = () => ({sin:{num:null,den:null}, cos:{num:null,den:null}, tan:{num:null,den:null}});
let boxes = {A:freshAng(), B:freshAng()};
const SYM = {A:'α', B:'β'};

// notation de longueur : AB (hypoténuse), AC et BC selon l'angle
function roleLabel(ang, role){
  if(role==='hyp') return 'AB';
  return (ang==='A') === (role==='opp') ? 'BC' : 'AC';
}
// couleur du côté désigné : [BC] rouge = opposé à α = adjacent à β ; [AC] mauve
function roleColor(ang, role){
  if(role==='hyp') return 'var(--ink)';
  return (ang==='A') === (role==='opp') ? 'var(--red)' : 'var(--purple)';
}
const angleJuste = ang => ['sin','cos','tan'].every(fn=>boxes[ang][fn].num===CORRECT[fn].num && boxes[ang][fn].den===CORRECT[fn].den);

const CONSIGNES = {
  trace: "Trace un triangle rectangle.",
  noms: "Nomme les sommets du triangle pour obtenir un triangle rectangle en C.",
  hyp:  "Clique sur l'hypoténuse du triangle ABC.",
  adjA: `Clique sur le côté adjacent à ${ANG.A}.`,
  oppA: `Clique sur le côté opposé à ${ANG.A}.`,
  ratA: "Complète les formules suivantes.",
  adjB: `Maintenant, clique sur le côté adjacent à ${ANG.B}.`,
  oppB: `Maintenant, clique sur le côté opposé à ${ANG.B}.`,
  ratB: "Complète les formules suivantes.",
  fini: "Bravo ! Continue vers les propriétés."
};

let derniereCle=null, impulsionT0=0;
function impulser(el){ if(!el) return; el.classList.remove('impulsion'); void el.offsetWidth; el.classList.add('impulsion');
  setTimeout(()=>el.classList.remove('impulsion'), 1600); }
// lueur du canevas (côtés à glisser, sommets à nommer) renforcée pendant 1,5 s
function impulserCanevas(){
  impulsionT0=performance.now();
  (function boucle(){ draw(); if(performance.now()-impulsionT0<1500) requestAnimationFrame(boucle); })();
}
function boostCanevas(){ const t=(performance.now()-impulsionT0)/1500; return t<1 ? Math.sin(Math.PI*Math.min(1,t*1.4)) * (1-t) : 0; }
function buildPanel(){
  ratiosEl.innerHTML='';
  if(!stage2()){
    const trace = !triangle || mode!=='snapped';
    const c=document.createElement('div'); c.className='consigne';
    c.innerHTML = CONSIGNES[trace ? 'trace' : phase] + (messageFaux ? `<span class="faux">${messageFaux}</span>` : '');
    ratiosEl.append(c);
    const cle = trace ? 'trace' : phase, nouvelle = cle!==derniereCle;
    derniereCle=cle;
    if(nouvelle) requestAnimationFrame(()=>{ impulser(c); ratiosEl.querySelectorAll('.colonne,.jeton').forEach(impulser);
      if(['noms','ratA','ratB'].includes(cle)) impulserCanevas();
      if(cle==='fini') impulser(document.getElementById('continue')); });
    if(trace){ majIndice(); return; }
    if(phase==='noms') ratiosEl.append(trayJetons());
  }
  const i=phaseIdx();
  const angs = stage2() ? ['A','B'] : (phase==='ratB'||phase==='fini') ? ['B'] : phase==='ratA' ? ['A'] : [];
  angs.forEach(ang=>{
    const col=document.createElement('div'); col.className='colonne'; col.dataset.ang=ang;
    ['sin','cos','tan'].forEach(fn=>{
      const r=document.createElement('div'); r.className='ratio'; r.dataset.fn=fn; r.dataset.ang=ang;
      const fnEl=document.createElement('span'); fnEl.className='fn'+(stage2()?' lueur':''); fnEl.textContent=`${fn}(${SYM[ang]})`;
      fnEl.style.color = ang==='A' ? 'var(--purple)' : 'var(--red)';
      const eq=document.createElement('span'); eq.className='eq'; eq.textContent='=';
      const frac=document.createElement('div'); frac.className='frac';
      const bar=document.createElement('div'); bar.className='bar';
      frac.append(mkBox(ang,fn,'num'), bar, mkBox(ang,fn,'den'));
      r.append(fnEl,eq,frac); col.append(r);
    });
    ratiosEl.append(col);
  });
  majIndice();
  refreshBoxes();
}
function majIndice(){
  const vis = stage2() || (triangle && mode==='snapped' && (phase==='ratA' || phase==='ratB'));
  document.getElementById('indiceWrap').style.display = vis ? 'inline-block' : 'none';
  if(!vis) document.getElementById('indicePop').classList.remove('vu');
}
document.getElementById('indice').addEventListener('click',ev=>{
  ev.stopPropagation();
  const pop=document.getElementById('indicePop'); pop.classList.toggle('vu');
  if(pop.classList.contains('vu') && !indiceVu){ indiceVu=true; publierSuivi(); }
});
document.addEventListener('pointerdown',ev=>{
  if(!ev.target.closest('#indiceWrap')) document.getElementById('indicePop').classList.remove('vu');
});

// ---- étape noms : faire glisser A, B, C sur les sommets ----
function trayJetons(){
  const tray=document.createElement('div'); tray.className='jetons';
  ['A','B','C'].filter(l=>!placement.includes(l)).forEach(l=>{
    const j=document.createElement('div'); j.className='jeton lueur'; j.textContent=l;
    let actif=false;
    j.onpointerdown=ev=>{
      ev.preventDefault(); actif=true;
      try{ j.setPointerCapture(ev.pointerId); }catch(_){}
      j.style.visibility='hidden';
      dragChip.className='rond'; dragChip.style.color=''; dragChip.textContent=l;
      dragChip.style.display='flex'; dragChip.style.left=ev.clientX+'px'; dragChip.style.top=ev.clientY+'px';
    };
    j.onpointermove=ev=>{ if(!actif) return; dragChip.style.left=ev.clientX+'px'; dragChip.style.top=ev.clientY+'px'; };
    j.onpointerup=ev=>{
      if(!actif) return; actif=false;
      hideChip(); dragChip.className=''; j.style.visibility='';
      const r=cv.getBoundingClientRect();
      deposerLettre(l, {x:ev.clientX-r.left, y:ev.clientY-r.top});
    };
    tray.append(j);
  });
  return tray;
}
function deposerLettre(l, pt){
  if(!triangle || phase!=='noms') return;
  let i=-1, bd=48;
  triangle.pts.forEach((v,k)=>{ const d=dist(v,pt); if(d<bd){ bd=d; i=k; } });
  if(i<0) return;                                   // lâché à côté : la lettre revient
  const ri=triangle.rightIndex;
  if(placement[i]) messageFaux="Ce sommet a déjà un nom.";
  else if(l==='C' && i!==ri){ ec++; messageFaux="Le triangle doit être rectangle en C : le point C est le sommet de l'angle droit."; }
  else if(l!=='C' && i===ri){ ec++; messageFaux=`Le sommet de l'angle droit doit s'appeler C, pas ${l}.`; }
  else { placement[i]=l; messageFaux=''; }
  if(placement.every(Boolean)){
    triangle.labels=placement.slice();
    buildPanel(); draw(); publierSuivi();
    setTimeout(()=>{ if(phase==='noms'){ phase='hyp'; buildPanel(); draw(); publierSuivi(); } }, 450);
    return;
  }
  buildPanel(); draw(); publierSuivi();
}
function mkBox(ang,fn,pos){
  const b=document.createElement('div');
  b.className='box'; b.dataset.ang=ang; b.dataset.fn=fn; b.dataset.pos=pos;
  return b;
}
function refreshBoxes(){
  document.querySelectorAll('.box').forEach(b=>{
    const {ang,fn,pos}=b.dataset, role=boxes[ang][fn][pos];
    if(role){ b.textContent=roleLabel(ang,role); b.style.color=roleColor(ang,role); b.classList.add('filled'); }
    else { b.textContent=''; b.style.color=''; b.classList.remove('filled'); }
  });
  document.querySelectorAll('.ratio').forEach(r=>{
    const {fn,ang}=r.dataset, st=boxes[ang][fn];
    if(st.num && st.den){
      const ok = st.num===CORRECT[fn].num && st.den===CORRECT[fn].den;
      r.classList.toggle('correct', ok); r.classList.toggle('wrong', !ok);
      const sig=`${ang}:${fn}:${st.num}/${st.den}`;
      if(!ok && !stage2() && !errSeen.has(sig)){ errSeen.add(sig); err1++; }
    } else { r.classList.remove('wrong'); r.classList.remove('correct'); }
  });
  // passage à l'étape suivante quand les trois fractions sont justes
  if(!stage2() && phase==='ratA' && angleJuste('A')){
    phase='adjB'; rev.AC=null; rev.BC=null;        // les étiquettes des côtés de l'angle droit vont changer
    setTimeout(()=>{ buildPanel(); draw(); publierSuivi(); }, 700);
  } else if(!stage2() && phase==='ratB' && angleJuste('B')){
    phase='fini';
    setTimeout(()=>{ buildPanel(); draw(); publierSuivi(); }, 400);
  }
  document.getElementById('continue').style.display = (!stage2() && phase==='fini') ? 'inline-block' : 'none';
  publierSuivi();
}
function boxAt(cx,cy){
  let hit=null;
  document.querySelectorAll('.box').forEach(b=>{
    const r=b.getBoundingClientRect();
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) hit=b;
  });
  return hit;
}
function showChip(clientX,clientY){
  if(!dragSide) return;
  dragChip.style.display='block'; dragChip.style.left=clientX+'px'; dragChip.style.top=clientY+'px';
  dragChip.style.color=dragSide.color; dragChip.textContent=dragSide.label;
}
function hideChip(){ dragChip.style.display='none'; }

// ---------- étape 2 : propriétés ----------
// jetons : « sin:A » = sin(α), « cos:B » = cos(β), …
const jeton = t => { const [fn,a]=t.split(':'); return {fn, a}; };
const texteJeton = t => { const {fn,a}=jeton(t); return `${fn}(${SYM[a]})`; };
function propTemplates(){
  const sinOuCos = t => ['sin','cos'].includes(jeton(t).fn);
  return [
    {id:'pyth', n:3, parts:['', {b:0}, {sup:'2'}, ' + ', {b:1}, {sup:'2'}, ' = ', {saisie:2}],
     check:st=>{ const x=jeton(st[0]), y=jeton(st[1]);
       return x.a===y.a && x.fn!==y.fn && sinOuCos(st[0]) && sinOuCos(st[1]) && Number(String(st[2]).replace(',','.'))===1; }},
    // deux encadrements par ligne : un pour chaque angle
    {id:'r1', n:2, parts:['0 < ', {b:0}, ' < 1', {ecart:1}, '0 < ', {b:1}, ' < 1'],
     check:st=>sinOuCos(st[0]) && sinOuCos(st[1]) && jeton(st[0]).a!==jeton(st[1]).a},
    {id:'r2', n:2, parts:['0 < ', {b:0}, ' < 1', {ecart:1}, '0 < ', {b:1}, ' < 1'],
     check:st=>sinOuCos(st[0]) && sinOuCos(st[1]) && jeton(st[0]).a!==jeton(st[1]).a && !memePaire(st, propState.r1),
     presque:st=>memePaire(st, propState.r1) ? "Correct… mais c'est déjà écrit sur la ligne au-dessus." : null},
    {id:'c1', n:1, parts:['', {b:0}, ' = cos(β)'], check:st=>st[0]==='sin:A',
     presque:st=>st[0]==='cos:B' ? "Correct… mais chaque nombre est égal à soi-même." : null},
    {id:'c2', n:1, parts:['', {b:0}, ' = sin(β)'], check:st=>st[0]==='cos:A',
     presque:st=>st[0]==='sin:B' ? "Correct… mais chaque nombre est égal à soi-même." : null},
    {id:'c3', n:1, parts:['', {b:0}, ' = ', {frac1:'tan(β)'}], check:st=>st[0]==='tan:A'},
    // tan = sin / cos, une fois pour chaque angle
    {id:'tan', n:6, parts:['', {b:0}, ' = ', {frac:[1,2]}, {ecart:1}, '', {b:3}, ' = ', {frac:[4,5]}],
     check:st=>{ const un=k=>{ const [t,s,c]=st.slice(k,k+3).map(jeton); return t.fn==='tan' && s.fn==='sin' && c.fn==='cos' && t.a===s.a && s.a===c.a; };
       return un(0) && un(3) && jeton(st[0]).a!==jeton(st[3]).a; }},
  ];
}
let propState=null;   // {id: [jeton|null, …]}
// même ensemble de deux jetons (dans n'importe quel ordre)
function memePaire(a,b){ return !!(b && a.every(Boolean) && b.every(Boolean) && [...a].sort().join()===[...b].sort().join()); }

function buildProps(){
  const tmpl=propTemplates();
  if(!propState){ propState={}; tmpl.forEach(t=>propState[t.id]=Array(t.n).fill(null)); }
  const props=document.getElementById('props');
  props.innerHTML='<h2>Propriétés</h2>';
  const cons=document.createElement('div'); cons.className='consigne'; cons.id='consigne2';
  cons.textContent="Complète les propriétés suivantes.";
  props.append(cons);
  const quant=document.createElement('div'); quant.className='quant';
  quant.innerHTML=`Pour tous angles <span class="ang-a">α</span> et <span class="ang-b">β</span>, angles aigus d'un triangle rectangle :`;
  props.append(quant);
  tmpl.forEach(t=>{
    const row=document.createElement('div'); row.className='prop'; row.dataset.id=t.id;
    t.parts.forEach(part=>{
      if(typeof part==='string'){ row.append(document.createTextNode(part)); }
      else if(part.sup){ const s=document.createElement('span'); s.className='sup'; s.textContent=part.sup; row.append(s); }
      else if(part.frac){
        const f=document.createElement('span'); f.className='pfrac';
        const bar=document.createElement('span'); bar.className='pbar';
        f.append(mkPBox(t.id, part.frac[0]), bar, mkPBox(t.id, part.frac[1])); row.append(f);
      }
      else if(part.frac1){          // 1 sur une expression donnée
        const f=document.createElement('span'); f.className='pfrac pfixe';
        const un=document.createElement('span'); un.textContent='1';
        const bar=document.createElement('span'); bar.className='pbar';
        const den=document.createElement('span'); den.textContent=part.frac1;
        f.append(un, bar, den); row.append(f);
      }
      else if(part.b!==undefined){ row.append(mkPBox(t.id, part.b)); }
      else if(part.ecart){ const e=document.createElement('span'); e.className='ecart'; row.append(e); }
      else if(part.saisie!==undefined){            // nombre tapé au clavier
        const inp=document.createElement('input'); inp.className='pinput'; inp.type='text';
        inp.inputMode='decimal'; inp.maxLength=6; inp.autocomplete='off'; inp.dataset.id=t.id; inp.dataset.slot=part.saisie;
        const valider=()=>{ propState[t.id][part.saisie]=inp.value.trim()||null; refreshProps(); };
        inp.addEventListener('change',valider);
        inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
        row.append(inp);
      }
    });
    props.append(row);
  });
  refreshProps();
}
function mkPBox(id,slot){
  const box=document.createElement('span');
  box.className='pbox'; box.dataset.id=id; box.dataset.slot=slot;
  return box;
}
function refreshProps(){
  if(!propState) return;
  document.querySelectorAll('.pinput').forEach(inp=>{
    const v=propState[inp.dataset.id][+inp.dataset.slot];
    if(document.activeElement!==inp) inp.value=v??'';
    inp.classList.toggle('filled', !!v);
  });
  document.querySelectorAll('.pbox').forEach(b=>{
    const t=propState[b.dataset.id][+b.dataset.slot];
    if(t){ b.textContent=texteJeton(t); b.style.color = jeton(t).a==='A' ? 'var(--purple)' : 'var(--red)'; b.classList.add('filled'); }
    else { b.textContent=''; b.style.color=''; b.classList.remove('filled'); }
  });
  const tmpl=propTemplates();
  document.querySelectorAll('.prop').forEach(row=>{
    const t=tmpl.find(x=>x.id===row.dataset.id), st=propState[row.dataset.id];
    let note=row.querySelector('.note'); if(note) note.remove();
    row.classList.remove('correct','wrong','presque');
    if(st.every(v=>v!==null)){
      const ok=t.check(st), msg = !ok && t.presque ? t.presque(st) : null;
      row.classList.add(ok ? 'correct' : msg ? 'presque' : 'wrong');
      if(msg){ note=document.createElement('div'); note.className='note'; note.textContent=msg; row.append(note); }
      const sig=`${row.dataset.id}:${st.join(',')}`;
      if(!ok && !msg && !err2Seen.has(sig)){ err2Seen.add(sig); err2++; }
    }
  });
  const c2=document.getElementById('consigne2');
  if(c2){
    const tout=tmpl.every(t=>{const v=propState[t.id]; return v.every(x=>x!==null) && t.check(v);});
    if(tout && !c2.classList.contains('termine')) impulser(c2);
    c2.classList.toggle('termine', tout);
    c2.textContent = tout ? "Bravo ! Toutes les propriétés sont justes." : "Complète les propriétés suivantes.";
  }
  publierSuivi();
}
function pboxAt(cx,cy){
  let hit=null;
  document.querySelectorAll('.pbox').forEach(b=>{
    const r=b.getBoundingClientRect();
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom) hit=b;
  });
  return hit;
}
// glisser sin(α), cos(β), … depuis le tableau des rapports vers les propriétés
let dragFn=null;
function enableFnDrag(){
  document.querySelectorAll('.ratio .fn').forEach(fnEl=>{
    fnEl.onpointerdown=ev=>{
      if(!stage2()) return;
      ev.preventDefault();
      const r=fnEl.closest('.ratio');
      dragFn=`${r.dataset.fn}:${r.dataset.ang}`;
      try{ fnEl.setPointerCapture(ev.pointerId); }catch(_){}
      dragChip.style.display='block';
      dragChip.style.color = r.dataset.ang==='A' ? getCSS('--purple') : getCSS('--red');
      dragChip.textContent=texteJeton(dragFn);
      dragChip.style.left=ev.clientX+'px'; dragChip.style.top=ev.clientY+'px';
    };
    fnEl.onpointermove=ev=>{
      if(!dragFn) return; ev.preventDefault();
      dragChip.style.left=ev.clientX+'px'; dragChip.style.top=ev.clientY+'px';
      document.querySelectorAll('.pbox.over').forEach(x=>x.classList.remove('over'));
      const b=pboxAt(ev.clientX,ev.clientY); if(b) b.classList.add('over');
    };
    fnEl.onpointerup=ev=>{
      if(!dragFn) return; ev.preventDefault();
      hideChip();
      document.querySelectorAll('.pbox.over').forEach(x=>x.classList.remove('over'));
      const b=pboxAt(ev.clientX,ev.clientY);
      if(b){ propState[b.dataset.id][+b.dataset.slot]=dragFn; refreshProps(); }
      dragFn=null;
    };
  });
}

document.getElementById('continue').addEventListener('click',()=>{
  if(!triangle){
    const cxp=W*0.45, cyp=H*0.4, s=Math.min(W,H)*0.28;
    const pts=[{x:cxp,y:cyp},{x:cxp+s*1.4,y:cyp},{x:cxp,y:cyp+s}];
    triangle={pts, rightIndex:0, angles:triangleAngles(pts), dev:0};
    triangle.labels=vertexLabels(pts,0);
    mode='snapped';
  }
  document.body.classList.add('stage2');
  document.getElementById('continue').style.display='none';
  // les deux tableaux de rapports, complétés, servent de réserve de jetons
  ['A','B'].forEach(a=>['sin','cos','tan'].forEach(fn=>boxes[a][fn]={num:CORRECT[fn].num, den:CORRECT[fn].den}));
  // chaque côté de l'angle droit porte ses deux rôles
  rev={AB:'AB', AC:'AC', BC:'BC'};
  propState=null;
  buildPanel(); buildProps(); enableFnDrag();
  requestAnimationFrame(()=>{ impulser(document.getElementById('consigne2')); document.querySelectorAll('.ratio .fn').forEach(impulser); });
  requestAnimationFrame(()=>{ resize(); fitTriangleToCanvas(); draw(); publierSuivi(); });
});

function fitTriangleToCanvas(){
  if(!triangle) return;
  const p=triangle.pts;
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for(const v of p){minx=Math.min(minx,v.x);miny=Math.min(miny,v.y);maxx=Math.max(maxx,v.x);maxy=Math.max(maxy,v.y);}
  const bw=maxx-minx||1, bh=maxy-miny||1, margin=95;
  const sc=Math.min((W-margin*2)/bw, (H-margin*2)/bh);
  const bcx=(minx+maxx)/2, bcy=(miny+maxy)/2;
  triangle.pts=p.map(v=>({x:W/2+(v.x-bcx)*sc, y:H/2+(v.y-bcy)*sc}));
}

undoBtn.addEventListener('click',reset);
function reset(){
  mode='idle';path=[];triangle=null;snapTarget=null;
  phase='noms'; placement=[null,null,null]; rev={AB:null,AC:null,BC:null}; messageFaux=''; flash=null;
  document.getElementById('indicePop').classList.remove('vu');
  boxes={A:freshAng(), B:freshAng()}; dragSide=null; dragFn=null; propState=null; hideChip();
  document.body.classList.remove('stage2');
  document.getElementById('continue').style.display='none';
  document.getElementById('props').innerHTML='';
  indiceVu=false;
  buildPanel(); majXP();
  promptEl.style.opacity=1;
  draw();
}

// ---- suivi de classe (suivi-commun.js) : état publié pour la page de l'enseignant ----
// barre de progression : tracé, 8 étapes de la partie 1, 7 propriétés
const NB_ETAPES=16;
let xpAvant=0;
function nbFaites(){
  if(stage2()){
    const ok = propState ? propTemplates().filter(t=>{const v=propState[t.id]; return v.every(x=>x!==null) && t.check(v);}).length : 0;
    return 9+ok;
  }
  if(!triangle || mode!=='snapped') return 0;
  return 1+PHASES.indexOf(phase);
}
function majXP(){
  const xp=document.getElementById('xp');
  if(xp.querySelectorAll('.seg').length!==NB_ETAPES){
    for(let i=0;i<NB_ETAPES;i++){ const sg=document.createElement('span'); sg.className='seg'; xp.insertBefore(sg, document.getElementById('xpN')); }
  }
  const k=nbFaites(), segs=xp.querySelectorAll('.seg'), n=document.getElementById('xpN');
  segs.forEach((sg,i)=>sg.classList.toggle('on', i<k));
  if(k>xpAvant){
    for(let i=xpAvant;i<k;i++){ const sg=segs[i]; sg.classList.remove('flash'); void sg.offsetWidth; sg.classList.add('flash'); }
    n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
  }
  xpAvant=k;
  n.textContent=`${k} / ${NB_ETAPES}`;
}
function publierSuivi(){
  majXP();
  if(!window.SUIVI) return;
  const tri=(triangle && mode==='snapped') ? triangle : null;
  const st2=stage2();
  const b={};
  ['A','B'].forEach(a=>{ b[a]={}; ['sin','cos','tan'].forEach(fn=>b[a][fn]=[boxes[a][fn].num, boxes[a][fn].den]); });
  const lab = tri ? (phase==='noms' && !st2 ? placement : (tri.labels || vertexLabels(tri.pts,tri.rightIndex))) : null;
  const etat={ pts: tri ? tri.pts.map(p=>[Math.round(p.x),Math.round(p.y)]) : null, ri: tri ? tri.rightIndex : null, lab,
               ph: tri ? phaseIdx() : -1, b, p: st2 ? propState : null };
  let pOk=0;
  if(st2 && propState) pOk=propTemplates().filter(t=>{const v=propState[t.id]; return v.every(x=>x!==null) && t.check(v);}).length;
  window.SUIVI.publier(etat, {tri:!!tri, ph: tri ? phaseIdx() : -1, ec, e:err1, p:pOk, e2:err2, h:indiceVu?1:0});
}
window.publierSuivi=publierSuivi;

buildPanel(); majXP();
resize();
</script>

window.publierSuivi();
